services:
  umiji-subscription-page:
    image: ghcr.io/therewasluna/umiji-subscription-page:latest
    container_name: umiji-subscription-page
    hostname: umiji-subscription-page
    restart: always
    env_file:
      - .env
    ports:
      - '127.0.0.1:3010:3010'
    networks:
      - umiji-network

networks:
  umiji-network:
    driver: bridge
    external: true
